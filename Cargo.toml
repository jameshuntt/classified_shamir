[package]
name = "classified_shamir"
version = "0.2.0"
edition = "2021"
rust-version = "1.70"
license = "MIT OR Apache-2.0"
description = "Shamir secret sharing in classified containers: split a ClassifiedBuffer or ClassifiedBytes into shares that zeroize, redact and compare in constant time, with the arithmetic from honest_shamir."
authors = ["James Hunt <james@1o.business>"]
repository = "https://github.com/jameshuntt/classified_shamir"
readme = "README.md"
keywords = ["shamir", "secret-sharing", "threshold", "zeroize", "security"]
categories = ["cryptography"]
include = ["src/**", "tests/**", "examples/**", "Cargo.toml", "README.md", "LICENSE-MIT", "LICENSE-APACHE"]

[features]
default = ["os-rng"]
# `split`, `split_bytes` and `refresh` without passing a generator: the operating system's.
os-rng = ["honest_shamir/os-rng"]

[dependencies]
classified = { version = "0.2.0", path = "../classified" }
honest_shamir = { version = "0.1.0", path = "../honest_shamir", default-features = false, features = ["std"] }

[dev-dependencies]
rand_chacha = "0.9"

[[example]]
name = "custody"
required-features = ["os-rng"]
